name: Build Android APK

on:
  push:
    branches: [ main, "arena/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate wrapper & build APKs
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - name: List outputs
        run: find app/build/outputs -type f -name '*.apk' -ls

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: minz-mahallu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: minz-mahallu-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release with APKs
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v2.0.0-${{ github.run_number }}
          name: Minz Mahallu Android v2.0.0 (#${{ github.run_number }})
          body: |
            Native Kotlin + custom Jetpack Compose build of Minz Mahallu Management System.
            - Debug and release APKs attached
            - Same modules & SQLite wiring as the Electron desktop app
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
