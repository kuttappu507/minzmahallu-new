name: Build Android APK

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# GitHub removed Node.js 20 from runners in Sept 2026 — force all JS actions onto Node 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # NOTE: android-actions/setup-android@v3 is deprecated and fails on current
      # runners. ubuntu-latest already ships the Android SDK (ANDROID_SDK_ROOT);
      # we just ensure the platform + build-tools required by compileSdk 35.
      - name: Setup Android SDK packages
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Uses the committed gradle wrapper (gradle-8.9) directly — no extra action needed.
      - name: Build APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: minz-mahallu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: minz-mahallu-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Publish a GitHub release only for main-branch pushes (not PRs).
      - name: Publish release with APKs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          TAG="android-v2.0.0-${{ github.run_number }}"
          gh release create "$TAG" \
            --title "Minz Mahallu Android v2.0.0 (#${{ github.run_number }})" \
            --generate-notes \
            app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
